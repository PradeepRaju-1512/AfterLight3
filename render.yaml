services:
  - type: web
    name: afterlight
    runtime: node
    plan: free
    # The C++ engine is compiled by `npm run build` (build:engine), so it is not repeated here.
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
